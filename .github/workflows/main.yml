name: CI - AI Code Reviewer

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  test:
    runs-on: ubuntu-latest
    
    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: revix
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
    - uses: actions/checkout@v4
    
    - name: Install uv
      uses: astral-sh/setup-uv@v5
      with:
        enable-cache: true
        cache-dependency-path: "uv.lock"

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version-file: "pyproject.toml"

    - name: Install dependencies
      run: uv sync --frozen

    - name: Run Linting
      run: |
        uv run ruff check .
        uv run ruff format --check .
        uv run mypy app

    - name: Run Tests
      env:
        # Dummy values for testing
        SECRET_KEY: 'test-secret-key'
        DATABASE_URL: 'postgresql://postgres:postgres@localhost:5432/revix'
        ANTHROPIC_API_KEY: 'test-anthropic-key'
        GITHUB_APP_ID: ${{ secrets.REVIX_APP_ID || '123' }}
        GITHUB_APP_PRIVATE_KEY_B64: ${{ secrets.REVIX_PRIVATE_KEY_B64 || 'ZHVtbXk=' }}
        GITHUB_WEBHOOK_SECRET: ${{ secrets.REVIX_WEBHOOK_SECRET || 'test-webhook-secret' }}
        DEBUG: 'True'
      run: |
        uv run pytest
